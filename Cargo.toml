[package]
name = "aether-lang"
version = "0.2.0"
edition = "2021"
authors = ["Z1529"]
description = "AetherLang - An explicit systems programming language"
license = "Apache-2.0"
repository = "https://github.com/J-x-Z/AetherLang"

[features]
default = ["llvm"]  # LLVM is the primary backend (like Rust)
llvm = ["dep:llvm-sys"]
llvm23 = ["dep:llvm-sys-23"]
c-only = []  # C backend fallback for environments without LLVM

[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Select one LLVM C API. LLVM 21 is the default for existing builds.
llvm-sys = { version = "211", optional = true, features = ["prefer-dynamic", "strict-versioning"] }
llvm-sys-23 = { package = "llvm-sys", version = "231", optional = true, features = ["prefer-dynamic", "strict-versioning"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Serialization (for structured feedback)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
target-lexicon = "0.13.5"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# Testing
pretty_assertions = "1.0"

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "aethc"
path = "src/main.rs"
