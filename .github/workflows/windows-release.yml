name: Verify Windows release bundle
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the Windows bundle
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the complete Windows archive
        required: true
        type: string
      source_commit:
        description: Expected full source commit in the bundle manifest
        required: true
        type: string
      linux_sha256:
        description: SHA-256 of the matching Linux x64 Rust seed archive for Win64 C ABI tests
        required: false
        type: string

permissions: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    # GitHub only exposes draft releases to identities with push access.
    # This job transfers bytes; the Windows job executes them separately.
    permissions:
      contents: write
    steps:
      - name: Download and verify the maintainer-selected release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARCHIVE_SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "aetherlang-$TAG-windows-x86_64.zip" --output windows.zip
          echo "$ARCHIVE_SHA256  windows.zip" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: windows.zip
          retention-days: 1
      - name: Fetch the matching Linux Rust seed
        if: inputs.linux_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          LINUX_SHA256: ${{ inputs.linux_sha256 }}
        run: |
          [[ "$LINUX_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "aetherlang-$TAG-linux-x86_64.tgz" --output linux.tgz
          echo "$LINUX_SHA256  linux.tgz" | sha256sum --check
      - uses: actions/upload-artifact@v4
        if: inputs.linux_sha256 != ''
        with:
          name: linux-seed
          path: linux.tgz
          compression-level: 0
          retention-days: 1
  emit-win64:
    needs: archive
    if: inputs.linux_sha256 != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-seed
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
      - name: Emit Win64 LLVM IR from the released Rust seed
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          tar -xzf linux.tgz
          seed="aetherlang-$TAG-linux-x86_64"
          test "$(jq -r .source_commit "$seed/manifest.json")" = "$SOURCE_COMMIT"
          mkdir -p oracle
          unzip -j windows.zip '*/tests/regressions/aggregates/win64.*' -d oracle
          for abi in gnu msvc; do
            for opt in 0 2; do
              "$seed/aethc" oracle/win64.aeth --backend llvm --target "x86_64-pc-windows-$abi" \
                --emit-llvm "-O$opt" -o "oracle/$abi-$opt.ll"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: win64-seed-ir
          path: oracle
          retention-days: 1
  windows:
    needs: [archive, emit-win64]
    if: ${{ !cancelled() && needs.archive.result == 'success' && (needs.emit-win64.result == 'success' || needs.emit-win64.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
      - name: Verify archive and manifest
        env:
          ARCHIVE_SHA256: ${{ inputs.sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if ((Get-FileHash windows.zip).Hash -ne $env:ARCHIVE_SHA256) { throw 'Archive SHA-256 mismatch' }
          Expand-Archive windows.zip bundle
          $entry = @(Get-ChildItem bundle -Recurse -File -Filter Test-Native.ps1)
          if ($entry.Count -ne 1) { throw 'Expected one native acceptance entry point' }
          $root = $entry[0].Directory.FullName
          $manifest = Get-Content (Join-Path $root manifest.json) -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:SOURCE_COMMIT) { throw 'Source revision mismatch' }
          "BUNDLE_ROOT=$root" >> $env:GITHUB_ENV
      - name: Install verified llvm-mingw UCRT driver
        run: |
          $name = 'llvm-mingw-20251216-ucrt-x86_64'
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20251216/$name.zip"
          curl.exe --fail --silent --show-error --location $url --output "$name.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash "$name.zip").Hash -ne '2d96a4b758f7f8deaec5065833fe025aa53cfc5f704d0524002510984da0ccf4') { throw 'Toolchain SHA-256 mismatch' }
          7z x "$name.zip" "-o$env:RUNNER_TEMP" -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AETHER_CLANG=$env:RUNNER_TEMP\$name\bin\x86_64-w64-mingw32-clang.exe" >> $env:GITHUB_ENV
      - name: Run packaged compiler, self-host, JXZ, LSP and CSV suites
        run: |
          & (Join-Path $env:BUNDLE_ROOT Test-Native.ps1) -Clang $env:AETHER_CLANG -WorkDir "$env:RUNNER_TEMP\aether-results"
          exit $LASTEXITCODE
      - uses: actions/download-artifact@v4
        if: inputs.linux_sha256 != ''
        with:
          name: win64-seed-ir
          path: oracle
      - name: Link and run Rust-emitted Win64 code with independent MinGW and MSVC C callers
        if: inputs.linux_sha256 != ''
        working-directory: oracle
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($abi in 'gnu','msvc') {
            if ($abi -eq 'gnu') {
              & $env:AETHER_CLANG -std=c11 -O2 -c win64.c -o oracle.obj
            } else {
              cl.exe /nologo /std:c11 /O2 /c win64.c /Fooracle.obj
            }
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            foreach ($opt in 0,2) {
              & $env:AETHER_CLANG -target "x86_64-pc-windows-$abi" "-O$opt" -c "$abi-$opt.ll" -o aether.obj
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              if ($abi -eq 'gnu') {
                & $env:AETHER_CLANG aether.obj oracle.obj -o probe.exe
              } else {
                cl.exe /nologo aether.obj oracle.obj /Feprobe.exe
              }
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              .\probe.exe
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              Write-Output "$abi O$opt bidirectional Win64 C ABI passed"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-results
          path: ${{ runner.temp }}/aether-results/**/results.json
