name: Build and execute
on:
  push:
    branches: [master, main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
jobs:
  c:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release --no-default-features
      - run: python3 scripts/validate.py --compiler target/release/aethc --work-dir target/validation --backends c
      - run: AETHC="$PWD/target/release/aethc" jxz/build.sh "$PWD/target/jxz"
      - run: python3 jxz/tests/integration.py --jxz target/jxz --aethc target/release/aethc --work-dir target/jxz-tests
  llvm:
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Install LLVM 21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --features llvm
      - run: cargo build --locked --release --features llvm
      - run: python3 scripts/validate.py --compiler target/release/aethc --work-dir target/validation
      - run: AETHC="$PWD/target/release/aethc" jxz/build.sh "$PWD/target/jxz"
      - run: python3 jxz/tests/integration.py --jxz target/jxz --aethc target/release/aethc --work-dir target/jxz-tests
  windows-c-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --no-default-features
      - run: cargo test --locked --no-default-features --bin aethc
