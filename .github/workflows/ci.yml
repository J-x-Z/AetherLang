name: Build and execute
on:
  push:
    branches: [master, main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
jobs:
  c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM object inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y llvm
      - name: Select Xcode object inspection tools
        if: runner.os == 'macOS'
        run: dirname "$(xcrun --find llvm-objdump)" >> "$GITHUB_PATH"
      - run: sh scripts/test.sh c
      - run: cargo build --locked --release --no-default-features
  llvm:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Install LLVM 21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev libpolly-21-dev libclang-rt-21-dev
          echo "$LLVM_SYS_211_PREFIX/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/test.sh llvm
      - run: cargo build --locked --release --features llvm
  windows-c-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --no-default-features
      - run: cargo test --locked --no-default-features --bin aethc
